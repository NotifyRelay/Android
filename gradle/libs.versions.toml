[versions]
# ============================================================================
# 与 E:\GitHub-code\WebDAVPass\Android\gradle\libs.versions.toml 保持同步。
# 规则：同名 key 的取值必须完全一致（取两项目较高者，并在上游有更新时升到最新稳定版）。
# 修改此文件时请同步修改另一个，避免两边再次漂移。
# ============================================================================
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.12"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
miuix = "0.9.4"
# 上游 miuix-navigation3-ui-android 只发布到 0.9.3，因此单独钉住
# 保留给 :scrcpy 子模块消费；:app 侧不再使用。
miuixNavigation3 = "0.9.3"
navigation3 = "1.1.7"
lifecycle = "2.11.0"
uiText = "1.12.1"
material3 = "1.4.0"
foundationLayout = "1.12.1"
runtime = "1.12.1"
ftpserver = "1.2.1"
remoteCreationCompose = "1.0.0-alpha19"
runtimeVersion = "1.12.1"
kotlinPluginCompose = "2.4.20"
composeBom = "2026.09.00"
accompanistPager = "0.36.0"
lifecycleRuntime = "2.11.0"
lifecycleRuntimeKtx = "2.11.0"
lifecycleRuntimeAndroid = "2.11.0"
room = "2.8.5"
navigationEventCompose = "1.1.2"
datastorePreferences = "1.2.1"
datastore = "1.2.1"
gson = "2.14.0"
okhttp = "5.5.0"
okio = "3.18.2"
jmdns = "3.6.3"
coil = "2.7.0"
coilCompose = "2.7.0"
kotlinxCoroutines = "1.11.0"
# UniFFI 生成的绑定内部使用 kotlinx.atomicfu（UniffiHandleMap 的原子计数器）
atomicfu = "0.28.0"
# UniFFI 生成的 Android 绑定使用 androidx.annotation.RequiresApi
androidxAnnotation = "1.9.1"
composeUi = "1.12.1"
compileSdk = "37"
targetSdk = "37"
minSdk = "29"
semver = "3.1.0"
paging = "3.5.1"
activityCompose = "1.13.0"
reorderable = "3.1.0"
timber = "5.0.1"
jna = "5.19.1"
libxposed = "102.0.0"
dexkit = "2.2.0"
ezhooktool = "1.2.2"
ktlint = "14.2.0"
# KMP 公共端（:shared）来源
kotlinMultiplatform = "2.4.20"
agpKmpLibrary = "9.4.1"
composeMultiplatform = "1.12.2"
# 声明值为下限；:shared 中实际由 miuix-nav 0.9.4 的传递依赖提升到 1.11.0（不加 constraint）
kotlinxSerialization = "1.9.0"
# AndroidX Compose 1.12.1 系列（对应 compose-bom 2026.09.00 的 ui/foundation/runtime 锁定版本）
composeFoundation = "1.12.1"
# AndroidX material-icons-extended（对应 compose-bom 2026.09.00 的锁定版本）
composeMaterialIconsExtended = "1.7.8"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
# 上游 miuix-navigation3-ui-android 只发布到 0.9.3；保留给 :scrcpy 子模块消费。
# :app 侧已迁移至 miuix-nav，见下文条目。
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
# 上游 miuix-navigation3-ui-android 只发布到 0.9.3；保留给 :scrcpy 子模块消费。
# :app 侧已迁移至 miuix-nav，见下文条目。
miuix-navigation3-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-navigation3-ui-android", version.ref = "miuixNavigation3" }
# androidx.navigation3-runtime：:app 侧已迁移至 miuix-nav；保留给 :scrcpy 子模块消费。
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
# lifecycle-viewmodel-navigation3：:app 侧不再使用；保留给 :scrcpy 子模块消费（如果它用）。
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "uiText" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundationLayout" }
androidx-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }
apache-ftpserver = { group = "org.apache.ftpserver", name = "ftpserver-core", version.ref = "ftpserver" }
androidx-remote-creation-compose = { group = "androidx.compose.remote", name = "remote-creation-compose", version.ref = "remoteCreationCompose" }
runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtimeVersion" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons", version.ref = "miuix" }
# navigationevent-compose：:app 侧不再使用；保留给 :scrcpy 子模块消费（如果它用）。
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationEventCompose" }
# miuix-nav：KMP 导航运行时，为 :shared commonMain 提供统一返回栈与路由 DSL。
# 依赖：navigationevent-compose（runtime）、foundation、lifecycle-*, kotlinx-serialization-json。
# :app 的 build.gradle.kts 已删除旧的 navigation3 / navigationevent/miuix-navigation3-ui，改用此库。
miuix-nav = { group = "top.yukonga.miuix.kmp", name = "miuix-nav", version.ref = "miuix" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "atomicfu" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-android = { group = "androidx.lifecycle", name = "lifecycle-runtime-android", version.ref = "lifecycleRuntimeAndroid" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
accompanist-pager-indicators = { group = "com.google.accompanist", name = "accompanist-pager-indicators", version.ref = "accompanistPager" }
semver = { group = "io.github.z4kn4fein", name = "semver", version.ref = "semver" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
# paging-common 为 KMP 公共端坐标（PagingSource 等），供 :data commonMain 使用
androidx-paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIconsExtended" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
ezhooktool-core = { group = "io.github.lingqiqi5211.ezhooktool", name = "core", version.ref = "ezhooktool" }
ezhooktool-xposed102 = { group = "io.github.lingqiqi5211.ezhooktool", name = "hook-xposed-102", version.ref = "ezhooktool" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# KMP 公共端（:shared）依赖
# miuix-ui 的 KMP 坐标（不带 -android 后缀，含 metadata 变体，可供 commonMain 使用）；
# libs.miuix.ui 是 miuix-ui-android 构件，仅限 Android 源集。
miuix-ui-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
# miuix-preference 的 KMP 坐标（含 metadata 变体，可供 commonMain 使用）
miuix-preference-kmp = { group = "top.yukonga.miuix.kmp", name = "miuix-preference", version.ref = "miuix" }
# kotlinx-serialization-json 为 commonMain @Serializable 提供序列化支持；
# app 的 Route.kt 也依赖它。
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
compose-multiplatform-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-multiplatform-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-multiplatform-foundation-layout = { group = "org.jetbrains.compose.foundation", name = "foundation-layout", version.ref = "composeMultiplatform" }
# 动画 API（animation-core / AnimatedVisibility 等）：CMP 侧以 animation 构件发布，
# androidx.compose.animation 的公共端实现由该构件的 metadata 变体提供。
compose-multiplatform-animation = { group = "org.jetbrains.compose.animation", name = "animation", version.ref = "composeMultiplatform" }
compose-multiplatform-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-multiplatform-ui-text = { group = "org.jetbrains.compose.ui", name = "ui-text", version.ref = "composeMultiplatform" }
compose-multiplatform-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "composeMultiplatform" }
compose-multiplatform-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-multiplatform-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
# org.jetbrains.compose.material3:material3 的 CMP 版本线止于 1.12.0-alpha03；
# org.jetbrains.compose.material:material-icons-extended 止于 1.7.3，均不覆盖 1.12.2。
# Android 侧 material3 / material-icons-extended 使用 androidx 条目（libs.androidx.material3、libs.androidx.compose.material.icons.extended）。

# app 侧 AndroidX Compose 显式版本（:app 现有实现使用）
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeFoundation" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "runtime" }



[bundles]
lifecycle = ["androidx-lifecycle-runtime", "androidx-lifecycle-runtime-ktx", "androidx-lifecycle-runtime-android"]
coil = ["coil", "coil-compose"]
datastore = ["androidx-datastore-preferences", "androidx-datastore"]
kotlinx-coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
paging = ["androidx-paging-runtime", "androidx-paging-compose"]


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinPluginCompose" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinMultiplatform" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agpKmpLibrary" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinMultiplatform" }
