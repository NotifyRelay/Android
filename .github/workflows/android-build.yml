
name: 打包并预发布release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup SSH keys
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY_CHECKUPDATA }}
            ${{ secrets.SSH_PRIVATE_KEY_SCRCPY }}

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk and sccache
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk,sccache

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('nativecore/notify-relay-core/Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('nativecore/notify-relay-core/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
            sccache-${{ runner.os }}-

      - name: Enable sccache for Rust builds
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_CACHE_SIZE=2G" >> $GITHUB_ENV

      - name: Decode keystore into app module
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Get versionName from Gradle (resolved value)
        id: version
        run: |
          # Use the Gradle task added to app/build.gradle.kts to print the computed version name.
          # -q silences extra Gradle output, leaving only the printed version on stdout.
          VERSION=$(./gradlew -q :app:printVersionName)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Validate version output
        run: |
          # Fail early if version output is empty or doesn't look like a semantic-like version
          if [ -z "${{ steps.version.outputs.version }}" ]; then
            echo "Version output is empty" >&2
            exit 1
          fi
          if ! echo "${{ steps.version.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Version does not match expected pattern (major.minor.patch)" >&2
            exit 1
          fi


      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed universal debug APK
        uses: actions/upload-artifact@v5
        with:
          name: universal-debug-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APKs (split by ABI)
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v5
        with:
          name: release-signed-apks
          path: app/build/outputs/apk/release/*-release.apk

      - name: Create GitHub Pre-release（挂 update.yml 已创建的 tag）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG 不存在。版本由 update.yml 在 push 到 main 时按 commit 语义创建，请先推送含 feat/fix 提交的更新"
            exit 1
          fi
          gh release create "$TAG" \
            --title "${{ steps.version.outputs.version }}" \
            --prerelease \
            app/build/outputs/apk/release/*-release.apk \
            app/build/outputs/apk/debug/app-debug.apk
