name: PR 构建检查

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup SSH keys
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY_CHECKUPDATA }}
            ${{ secrets.SSH_PRIVATE_KEY_SCRCPY }}

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk and sccache
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk,sccache

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('nativecore/notify-relay-core/Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('nativecore/notify-relay-core/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
            sccache-${{ runner.os }}-

      - name: Enable sccache for Rust builds
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_CACHE_SIZE=2G" >> $GITHUB_ENV

      - name: Create temporary keystore for build verification
        run: |
          keytool -genkey -v -keystore app/keystore.jks -alias pr \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass prpass -keypass prpass \
            -dname "CN=PR, OU=PR, O=NotifyRelay, L=Unknown, ST=Unknown, C=CN"

      - name: Build verification
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEY_ALIAS: pr
          STORE_PASSWORD: prpass
          KEY_PASSWORD: prpass
