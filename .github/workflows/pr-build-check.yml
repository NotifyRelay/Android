name: PR 构建检查

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY_CHECKUPDATA }}
            ${{ secrets.SSH_PRIVATE_KEY_SCRCPY }}

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Add Rust targets for Android
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Create temporary keystore for build verification
        run: |
          keytool -genkey -v -keystore app/keystore.jks -alias pr \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass prpass -keypass prpass \
            -dname "CN=PR, OU=PR, O=NotifyRelay, L=Unknown, ST=Unknown, C=CN"

      - name: Build verification
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEY_ALIAS: pr
          STORE_PASSWORD: prpass
          KEY_PASSWORD: prpass
