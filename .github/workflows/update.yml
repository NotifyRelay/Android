# 版本号更新：push 到 main 时用 semantic-release（conventional commits 官方算法）分析提交推断版本，
# 有 releasable 提交（feat→minor / fix|perf→patch / breaking→major）则回写 version.properties
# （versionCode +1）并创建 v{版本} tag，随后按该 tag 构建签名 APK 并创建 GitHub 预发布；全部配置内联在运行时生成，不提交进仓库；
# 回写使用 CI_PUSH_TOKEN（用户 PAT）直推 main（仓库级 ruleset 已为 xzy-nine 配置 bypass），
# semantic-release 生成的 commit 消息自带 skip-ci 标记防循环。
name: 版本号更新

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # 需完整历史与 tag 供 semantic-release 推断版本
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup SSH keys
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY_CHECKUPDATA }}
            ${{ secrets.SSH_PRIVATE_KEY_SCRCPY }}

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 会改动文件的格式化任务，作为写回前的格式门禁；失败则中止不写分支
      - name: 运行 ktlintFormat
        run: ./gradlew ktlintFormat

      - name: 生成 semantic-release 临时配置（不提交仓库）
        run: |
          # 配置文件与 bump 脚本仅在本次运行使用，用 .git/info/exclude 排除避免被当作未提交改动
          cat > .git/info/exclude <<'EXCLUDE'
          package.json
          release.config.mjs
          node_modules/
          package-lock.json
          EXCLUDE
          cat > package.json <<'JSON'
          {
            "name": "notifyrelay-android",
            "version": "2.167.0",
            "private": true
          }
          JSON
          cat > release.config.mjs <<'CONFIG'
          export default {
            branches: ['main'],
            plugins: [
              ['@semantic-release/commit-analyzer', { preset: 'conventionalcommits' }],
              ['@semantic-release/release-notes-generator', { preset: 'conventionalcommits' }],
              ['@semantic-release/exec', { prepareCmd: 'node /tmp/bump-version.mjs ${nextRelease.version}' }],
              ['@semantic-release/git', {
                assets: ['version.properties'],
                message: 'chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}',
              }],
            ],
          }
          CONFIG
          cat > /tmp/bump-version.mjs <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const nextVersion = process.argv[2]
          if (!nextVersion) {
            console.error('缺少版本参数')
            process.exit(1)
          }
          const file = 'version.properties'
          const text = readFileSync(file, 'utf8')
          const lines = text.split('\n').map((l) => l.replace(/\r$/, ''))
          const curCode = lines.find((l) => l.startsWith('versionCode='))?.split('=')[1]
          if (!curCode) {
            console.error('version.properties 中未找到 versionCode')
            process.exit(1)
          }
          const nextCode = Number(curCode) + 1
          const out =
            lines
              .map((l) =>
                l.startsWith('versionName=')
                  ? `versionName=${nextVersion}`
                  : l.startsWith('versionCode=')
                    ? `versionCode=${nextCode}`
                    : l
              )
              .join('\r\n') + (text.endsWith('\n') ? '\n' : '')
          writeFileSync(file, out)
          console.log(`回写 version.properties: versionName=${nextVersion}, versionCode=${nextCode}`)
          JS

      # 版本一律锁定：这些包不锁版本时会各自漂移到最新大版本，极易互相不兼容。
      # 曾发生的事故：conventional-changelog-conventionalcommits 漂移到 10.x 后，
      # 其内部依赖 @conventional-changelog/template 要求 conventional-changelog-writer@9+，
      # 而 @semantic-release/release-notes-generator@14 依赖的是 writer@^8，
      # 导致 generateNotes 阶段报 "Missing helper" 并中断发版（run 34860168743）。
      # 故此处固定在 9.x（该系列仅依赖 compare-func，与 writer@8 兼容）。
      # 升级时需确认 conventional-changelog-writer 在两侧的主版本一致。
      - name: 安装 semantic-release 及插件（不写入仓库，node_modules 已排除）
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            semantic-release@25.0.9 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@11.0.1 \
            conventional-changelog-conventionalcommits@9.3.1

      - name: 执行 semantic-release（推断版本、回写、打 tag、PAT 推送）
        id: release
        env:
          # git 插件使用该令牌推送（用户 PAT，可绕过 main 保护规则）
          GITHUB_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 无 releasable 提交时 semantic-release 正常退出（不回写不打 tag）
          npx --yes semantic-release

          # semantic-release 把 tag 打在自己新建的 chore(release) 提交上（即当前 HEAD），故直接取 HEAD 上的 tag；
          # 无 releasable 提交时既不回写也不打 tag，此处取到空值 → 后续打包与预发布整体跳过。
          TAG=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -z "$TAG" ]; then
            # 兜底：万一 tag 落在 pre-prepare 提交上，改用 version.properties 是否被回写来判定
            VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -cd '0-9.')
            if ! git diff --quiet "${{ github.sha }}" -- version.properties && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              TAG="v$VERSION"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "本次无 releasable 提交，未产生新 tag，跳过打包与预发布"
          else
            echo "本次发版：$TAG"
          fi

      # ---- 以下为原 android-build.yml（已删除）的构建与发布步骤，仅在本次产生新 tag 时执行 ----

      - name: Set up Gradle
        if: steps.release.outputs.tag != ''
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Set up Rust
        if: steps.release.outputs.tag != ''
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk and sccache
        if: steps.release.outputs.tag != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk,sccache

      - name: Cache Cargo dependencies
        if: steps.release.outputs.tag != ''
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('nativecore/notify-relay-core/Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-

      - name: Cache sccache
        if: steps.release.outputs.tag != ''
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('nativecore/notify-relay-core/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
            sccache-${{ runner.os }}-

      - name: Enable sccache for Rust builds
        if: steps.release.outputs.tag != ''
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_CACHE_SIZE=2G" >> $GITHUB_ENV

      - name: Decode keystore into app module
        if: steps.release.outputs.tag != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build debug APK
        if: steps.release.outputs.tag != ''
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed universal debug APK
        if: steps.release.outputs.tag != ''
        uses: actions/upload-artifact@v6
        with:
          name: universal-debug-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APKs (split by ABI)
        if: steps.release.outputs.tag != ''
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APKs
        if: steps.release.outputs.tag != ''
        uses: actions/upload-artifact@v6
        with:
          name: release-signed-apks
          path: app/build/outputs/apk/release/*-release.apk

      - name: Create GitHub Pre-release（挂 semantic-release 刚创建的 tag）
        if: steps.release.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          gh release create "$TAG" --title "$VERSION" --prerelease app/build/outputs/apk/release/*-release.apk app/build/outputs/apk/debug/app-debug.apk